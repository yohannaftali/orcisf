name: Build src (GUI)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build-src.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build-src.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
          - os: macos-latest
            preset: macos-release
          - os: ubuntu-latest
            preset: linux-release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GL/X11 dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev \
            autoconf autoconf-archive automake libtool libltdl-dev \
            ninja-build

      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Force MSVC compiler (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CC=cl" >> "$GITHUB_ENV"
          echo "CXX=cl" >> "$GITHUB_ENV"

      - name: Setup Ninja
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ea1a7396b05637a53bf23c078647ecc0edee4b80

      - name: Configure (${{ matrix.preset }})
        working-directory: src
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        working-directory: src
        run: cmake --build --preset ${{ matrix.preset }}
